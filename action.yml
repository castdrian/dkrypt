name: dkrypt decrypt
description: Decrypt an App Store or TestFlight release, or download a cached IPA, then verify its integrity
author: dkrypt
inputs:
  api-url:
    description: HTTPS base URL for dkrypt
    required: false
    default: https://ipa.dylib.dev
  api-key:
    description: dkrypt API key with decrypt and artifact access
    required: true
  bundle-id:
    description: App bundle identifier for a new decrypt
    required: false
  bundle-ids:
    description: JSON array of app bundle identifiers to process independently in one action run
    required: false
  channel:
    description: Decrypt source channel
    required: false
  lockfile:
    description: Optional dkrypt.lock JSON file that pins bundle IDs to exact source, resolved version, and build
    required: false
  update-lockfile:
    description: Resolve the requested release and write its exact source, version, and build into the lockfile
    required: false
    default: 'false'
  version:
    description: Optional exact App Store version or TestFlight version_build selector; leave empty for the latest release on the selected channel
    required: false
  resolve-only:
    description: Resolve the selected App Store or TestFlight release without queueing or downloading it
    required: false
    default: 'false'
  artifact-id:
    description: Download and verify an existing artifact by its ID instead of submitting a decrypt
    required: false
  latest-cached-channel:
    description: Download the newest cached artifact from appstore or testflight instead of submitting a decrypt
    required: false
  output:
    description: Destination IPA path for one app, or destination directory with bundle-ids
    required: false
  timeout-seconds:
    description: Maximum total time to submit and wait for a decrypt job
    required: false
    default: '1800'
  download-timeout-seconds:
    description: Maximum total time for all IPA download attempts
    required: false
    default: '600'
  publish-to-release:
    description: Upload the verified IPA to a GitHub Release after download
    required: false
    default: 'false'
  github-token:
    description: Token with contents:write permission for release publishing
    required: false
  release-tag:
    description: Existing GitHub Release tag to receive the IPA
    required: false
  create-release:
    description: Create a GitHub Release when the tag does not already have one
    required: false
    default: 'false'
  release-name:
    description: Name to use if the action creates a release
    required: false
  release-notes:
    description: Notes to use if the action creates a release
    required: false
  release-draft:
    description: Create new releases as drafts
    required: false
    default: 'false'
  release-asset-name:
    description: Optional .ipa filename to use for the uploaded release asset
    required: false
outputs:
  job-id:
    description: Created or reused dkrypt job ID; empty when downloading an existing artifact
    value: ${{ steps.dkrypt.outputs.job-id }}
  artifact-id:
    description: Resolved cached or downloaded artifact ID; batch results include an ID per app
    value: ${{ steps.dkrypt.outputs.artifact-id }}
  version:
    description: Resolved release version, including the TestFlight build number when applicable
    value: ${{ steps.dkrypt.outputs.version }}
  resolved-version:
    description: Resolved release version, including the TestFlight build number when applicable
    value: ${{ steps.dkrypt.outputs.resolved-version }}
  build:
    description: TestFlight build number when applicable
    value: ${{ steps.dkrypt.outputs.build }}
  channel:
    description: Resolved artifact channel
    value: ${{ steps.dkrypt.outputs.channel }}
  is_testflight:
    description: Whether the resolved artifact is a TestFlight build
    value: ${{ steps.dkrypt.outputs.is_testflight }}
  is-testflight:
    description: Whether the resolved artifact is a TestFlight build
    value: ${{ steps.dkrypt.outputs.is-testflight }}
  cache_hit:
    description: Whether dkrypt reused a cached artifact or the action downloaded an existing artifact
    value: ${{ steps.dkrypt.outputs.cache_hit }}
  cache-hit:
    description: Whether dkrypt reused a cached artifact or the action downloaded an existing artifact
    value: ${{ steps.dkrypt.outputs.cache-hit }}
  sha256:
    description: Downloaded IPA SHA-256 verified against dkrypt metadata; empty in resolve-only mode
    value: ${{ steps.dkrypt.outputs.sha256 }}
  size_bytes:
    description: Downloaded IPA byte count verified against dkrypt metadata; empty in resolve-only mode
    value: ${{ steps.dkrypt.outputs.size_bytes }}
  size-bytes:
    description: Downloaded IPA byte count verified against dkrypt metadata; empty in resolve-only mode
    value: ${{ steps.dkrypt.outputs.size-bytes }}
  path:
    description: Absolute path to the verified IPA; empty in resolve-only mode
    value: ${{ steps.dkrypt.outputs.path }}
  output:
    description: Absolute IPA path for a single app; batch paths are included per app in results-json and resolve-only is empty
    value: ${{ steps.dkrypt.outputs.output }}
  results-json:
    description: Per-app results for bundle-ids runs
    value: ${{ steps.dkrypt.outputs.results-json }}
  success-count:
    description: Number of successful apps in a bundle-ids run
    value: ${{ steps.dkrypt.outputs.success-count }}
  failure-count:
    description: Number of failed apps in a bundle-ids run
    value: ${{ steps.dkrypt.outputs.failure-count }}
  release-url:
    description: GitHub Release page receiving the verified IPA; empty when publishing is disabled
    value: ${{ steps.dkrypt.outputs.release-url }}
  release-asset-url:
    description: Download URL for the uploaded release IPA; empty when publishing is disabled
    value: ${{ steps.dkrypt.outputs.release-asset-url }}
runs:
  using: composite
  steps:
    - id: dkrypt
      shell: bash
      env:
        DKRYPT_API_URL: ${{ inputs.api-url }}
        DKRYPT_API_KEY: ${{ inputs.api-key }}
        DKRYPT_BUNDLE_ID: ${{ inputs.bundle-id }}
        DKRYPT_BUNDLE_IDS: ${{ inputs.bundle-ids }}
        DKRYPT_CHANNEL: ${{ inputs.channel }}
        DKRYPT_LOCKFILE: ${{ inputs.lockfile }}
        DKRYPT_UPDATE_LOCKFILE: ${{ inputs.update-lockfile }}
        DKRYPT_VERSION: ${{ inputs.version }}
        DKRYPT_RESOLVE_ONLY: ${{ inputs.resolve-only }}
        DKRYPT_ARTIFACT_ID: ${{ inputs.artifact-id }}
        DKRYPT_LATEST_CACHED_CHANNEL: ${{ inputs.latest-cached-channel }}
        DKRYPT_OUTPUT: ${{ inputs.output }}
        DKRYPT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        DKRYPT_DOWNLOAD_TIMEOUT_SECONDS: ${{ inputs.download-timeout-seconds }}
        DKRYPT_PUBLISH_TO_RELEASE: ${{ inputs.publish-to-release }}
        DKRYPT_GITHUB_TOKEN: ${{ inputs.github-token }}
        DKRYPT_RELEASE_TAG: ${{ inputs.release-tag }}
        DKRYPT_RELEASE_NAME: ${{ inputs.release-name }}
        DKRYPT_RELEASE_NOTES: ${{ inputs.release-notes }}
        DKRYPT_CREATE_RELEASE: ${{ inputs.create-release }}
        DKRYPT_RELEASE_DRAFT: ${{ inputs.release-draft }}
        DKRYPT_RELEASE_ASSET_NAME: ${{ inputs.release-asset-name }}
      run: node "$GITHUB_ACTION_PATH/.github/actions/dkrypt-decrypt/action.mjs"
branding:
  icon: download
  color: purple
