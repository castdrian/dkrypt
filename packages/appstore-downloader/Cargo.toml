[package]
name = "dkrypt-appstore-downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dkrypt-appstore-core = { path = "../appstore-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
url = "2"

[dev-dependencies]
tempfile = "3"
