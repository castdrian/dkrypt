dependsOn:
  - web
  - autoinstall
tasks:
  cliTest:
    command: node
    args:
      - --test
      - ../dkrypt-cli/test/cli.test.js
  test:
    command: bun
    args:
      - test
      - --isolate
      - --parallel=2
      - --max-concurrency=4
      - --timeout=15000
    deps:
      - web:build
  typecheck:
    command: bun
    args:
      - run
      - typecheck
  check:
    command: 'true'
    deps:
      - '~:test'
      - '~:cliTest'
      - '~:typecheck'
      - web:typecheck
      - web:build
  composeBuild:
    command: docker
    args:
      - compose
      - build
  autoinstallDeploy:
    command: ../../scripts/autoinstall-release
    args:
      - deploy
