name: dkrypt decrypt
description: Submit a dkrypt App Store decrypt, wait for completion, and download the IPA
inputs:
  api-url:
    description: HTTPS base URL for dkrypt
    required: false
    default: https://ipa.dylib.dev
  api-key:
    description: dkrypt API key with decrypt and artifact access
    required: true
  bundle-id:
    description: App bundle identifier
    required: true
  version:
    description: Optional exact App Store version
    required: false
  output:
    description: Destination IPA path
    required: false
  timeout-seconds:
    description: Maximum time to wait for the job
    required: false
    default: '1800'
outputs:
  job-id:
    description: Created or reused dkrypt job ID
    value: ${{ steps.dkrypt.outputs.job-id }}
  artifact-id:
    description: Decrypted IPA artifact ID
    value: ${{ steps.dkrypt.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - id: dkrypt
      shell: bash
      env:
        DKRYPT_API_URL: ${{ inputs.api-url }}
        DKRYPT_API_KEY: ${{ inputs.api-key }}
        DKRYPT_BUNDLE_ID: ${{ inputs.bundle-id }}
        DKRYPT_VERSION: ${{ inputs.version }}
        DKRYPT_OUTPUT: ${{ inputs.output }}
        DKRYPT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: node "$GITHUB_ACTION_PATH/action.mjs"
