replicaCount: 1

image:
  repository: ghcr.io/castdrian/dkrypt
  tag: main
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

secrets:
  existingSecret: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: dkrypt.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

usbAccess:
  enabled: false
  hostPath: /dev/bus/usb

persistence:
  state:
    size: 10Gi
    storageClass: ""
    existingClaim: ""
  artifacts:
    size: 100Gi
    storageClass: ""
    existingClaim: ""
  deviceSsh:
    size: 1Gi
    storageClass: ""
    existingClaim: ""

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 4Gi

nodeSelector: {}
tolerations: []
affinity: {}
